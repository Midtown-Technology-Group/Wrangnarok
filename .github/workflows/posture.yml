name: Posture

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: posture-${{ github.ref }}
  cancel-in-progress: true

# Recurring posture evaluation (issue #252). Credential-free by design: the
# checked-in baseline plus the posture unit tests run on schedule; live
# vendor runs stay operator-triggered (no production token in CI). Weekly
# Monday 06:23 UTC — off the :00/:30 mark.
jobs:
  posture:
    name: Baseline and posture checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate recorded baseline
        run: npm run posture:baseline

      - name: Posture unit tests
        run: ./node_modules/.bin/vitest run test/cloudflare-posture.test.ts test/saga-contract.test.ts test/saga-init-order.test.ts test/saga-helper-conventions.test.ts
