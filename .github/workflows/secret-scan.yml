name: Secret scan

# Issue #247: leaked-credential coverage beyond `npm audit` and filename
# guardrails. Gitleaks (CLI, pinned) scans the tree plus git history for
# hardcoded secrets; findings upload as SARIF to code scanning. Dependency
# CVEs stay with Dependabot/npm audit and semantic bugs with CodeQL — this
# workflow MUST NOT add dependency scanning (no Trivy vuln/config overlap).
#
# Tool choice rationale (documented in SECURITY.md): Gitleaks CLI over
# gitleaks-action (the action wrapper needs a GITLEAKS_LICENSE org secret,
# which would break credential-free PR CI) and over Trivy (Trivy's vuln finds
# would duplicate npm audit/Dependabot with extra maintenance and noise).
# Gitleaks adds distinct coverage: credentials under arbitrary filenames,
# fixtures/docs/examples, with fail-closed behavior on high-confidence leaks.
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # Main gate: fails closed (exit 1) on any leak outside the narrowly
      # scoped allowlists in .gitleaks.toml. SARIF is uploaded below.
      - name: Scan tree and history
        run: |
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif

      # Controlled canary (#247 acceptance): the committed fixture MUST be
      # detected when scanned in isolation (temp dir, so the fixture-path
      # allowlist does not apply). Proves the scanner path works; the main
      # scan above stays green because the fixture path IS allowlisted.
      - name: Canary fixture check
        run: |
          set -euo pipefail
          rm -rf /tmp/gitleaks-canary
          mkdir -p /tmp/gitleaks-canary
          cp test/fixtures/secret-scan/planted-canary.txt /tmp/gitleaks-canary/
          if /tmp/gitleaks detect --source /tmp/gitleaks-canary --no-git \
            --config .gitleaks.toml --redact --verbose; then
            echo "Canary NOT detected: scanner missed the planted fixture."
            exit 1
          else
            echo "Canary detected as expected."
          fi

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
