name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two parallel gates with identical coverage to the old serial job: wall time
# is the max, not the sum. `Validate` aggregates both so branch protection
# keeps requiring exactly one check name.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: the dev tree carries an unfixable
      # sharp/libheif finding via miniflare that never ships in the Worker
      # bundle (see SECURITY.md). A finding here is a real advisory.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Guardrails (secrets, banned patterns)
        shell: bash
        run: |
          # Local-only secret files must never be tracked in git.
          tracked_secrets="$(git ls-files | grep -E '(^\.dev\.vars$|seed-local\.override\.sql$)')" || true
          if [[ -n "$tracked_secrets" ]]; then
            echo "Tracked secret files must not be committed:"
            echo "$tracked_secrets"
            exit 1
          fi
          # Stale Cloudflare test harness must not return (see docs/testing.md).
          if grep -rn '@cloudflare/vitest-pool-workers' src test client/src scripts --include='*.ts' --include='*.tsx' --include='*.mjs' --include='*.js'; then
            exit 1
          fi
          # workerd has no redirect:'error' (see docs/upstream-spec.md);
          # vendor fetch must use redirect:'manual' plus explicit 3xx handling.
          if grep -rEn "redirect:\s*['\"]error['\"]" src test client/src scripts; then
            exit 1
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Lane supervision (steward checklist stop rule, #193): every lane PR
      # must carry a current scopes/<lane>.scope covering its diff, and
      # migration filenames must be unique (steward-owned numbering in
      # docs/migration-ledger.md). Advisory until lanes adopt their files;
      # fails closed on duplicate migration numbers (ambiguous schema).
      - name: Lane scope and migration ledger
        shell: bash
        run: |
          node scripts/lane-scope.mjs --self-check || true
          dupes="$(ls migrations/*.sql | sed 's|.*/||' | cut -c1-4 | sort | uniq -d)"
          if [[ -n "$dupes" ]]; then
            echo "Duplicate migration numbers (see docs/migration-ledger.md):"
            echo "$dupes"
            exit 1
          fi

      # Temp-dir roundtrip of the file-based mailbox bridge (alias, send,
      # read, reply correlation). No credentials, no network, no live store.
      - name: Mailbox bridge selftest
        run: npm run mailbox:selftest

      # Stub-fetch selftests for the preview helpers (smoke probe, token
      # payload). No credentials, no network, no live store.
      - name: Preview helper selftests
        run: npm run preview:smoke:selftest && npm run preview:token:selftest

      - name: Validate repository contract
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          test -s AGENTS.md
          test -s docs/lexicon.md
          test -s docs/upstream-spec.md
          test -s docs/testing.md
          test -s docs/architecture/001-execution-model.md
          test -s docs/architecture/002-saga-identity.md
          test -s docs/architecture/003-integrations-connections.md
          test -s docs/architecture/004-ci-cd.md
          test -s docs/architecture/005-secret-storage.md
          test -s docs/architecture/006-naming.md
          test -s docs/architecture/007-mvp-slice.md
          test -s docs/architecture/008-full-stack-app.md
          test -s docs/architecture/009-workers-builds-evaluation.md

          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "END OF TERMS AND CONDITIONS" LICENSE

  runtime:
    name: Runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          verbose: true

      # system.smoke exercises the same path locally that post-deploy smoke
      # exercises in dev: Worker request handling, D1, Workflow Operations,
      # terminal persistence, and the usage block. Credential-free workerd.
      - name: Smoke saga (local, credential-free)
        run: npx vitest run test/smoke.test.ts

      - name: Build UI
        run: npm run build:ui

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Wrangler dry run (dev environment)
        run: npx wrangler deploy --dry-run --env dev

      # Worker bundle budget (ADR 004): fails closed over 100 KiB so
      # dependency bloat and cold-start creep break the build.
      - name: Worker bundle budget
        run: npm run check:bundle

      # Applies migrations through the Wrangler CLI against local D1, catching
      # CLI-vs-workerd drift that in-test DB.exec alone would miss.
      - name: D1 migrations (local)
        run: npm run db:migrate:local

  validate:
    name: Validate
    needs: [static, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gates green
        run: echo "static and runtime checks passed."
