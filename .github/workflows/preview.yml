name: Preview

# PR preview: deploy the branch to the shared disposable preview Worker and
# smoke system.smoke against it. Skips gracefully without secrets (forks):
# credential-free CI on the PR itself stays the merge gate.
#
# Issue #376 (trust boundary): every step below runs the PR's checked-out
# code (checkout takes the merge revision; npm ci / npx execute the PR's
# dependency tree) while CLOUDFLARE_PREVIEW_TOKEN is in the environment, so
# a malicious same-repo PR could exfiltrate it. Mitigations in this file:
# (a) checkout pins the merge revision explicitly (no ref ambiguity);
# (b) the minted token defaults to a 30-day expiry and least-privilege
# groups (see mint-preview-token.mjs), bounding theft blast radius;
# (c) the token must live in a DEDICATED preview-only Cloudflare account
# (documented in the mint script). A manual approval gate before deploy
# remains a steward follow-up.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy and smoke
    # NOTE (issue #225): GitHub rejects `secrets.*` in job-level `if:`
    # (zero-job failed runs), so the job always evaluates and each
    # credential-needing step gates on the probe below instead. Without
    # secrets (forks) the workflow completes as a normal skip.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Issue #376: credential-bearing steps run under the `preview`
    # environment, so the token is an environment secret (not a repo
    # secret): stewards can add required reviewers on the environment as a
    # manual approval gate, and PR code that runs before approval never
    # sees the token. Move CLOUDFLARE_PREVIEW_TOKEN from a repo secret to
    # the `preview` environment secret when enabling the gate.
    environment: preview

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Explicit merge revision (issue #376): no ref ambiguity about
          # which code runs alongside the preview token below. Credentials
          # are not persisted: no later step uses authenticated git, and
          # PR-controlled commands must not read the checkout credential.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # Credential-presence probe: exposes the secret through env (the
      # supported pattern) and publishes a non-secret signal for the
      # step-level conditionals below.
      - name: Check preview credentials
        id: creds
        env:
          PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
        run: |
          if [[ -z "$PREVIEW_TOKEN" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No preview credentials; deploy/smoke steps will skip."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build:ui

      - name: Deploy preview Worker
        if: steps.creds.outputs.present == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          LOG="$(npx wrangler deploy --env preview 2>&1 | tee deploy.log)"
          URL="$(printf '%s' "$LOG" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' | head -n 1)"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Migrate preview D1
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env preview --remote

      # Ephemeral fixture credential: generated per run, masked before any
      # use, planted on the preview Worker only. Nothing to rotate on leak —
      # the next run replaces it.
      - name: Plant ephemeral LAB_TOKEN
        if: steps.creds.outputs.present == 'true'
        id: lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx wrangler secret put LAB_TOKEN --env preview
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Smoke preview
        if: steps.creds.outputs.present == 'true'
        run: |
          set -o pipefail
          node scripts/smoke-preview.mjs --base-url "${{ steps.deploy.outputs.url }}" --token "${{ steps.lab.outputs.token }}" 2>&1 | tee smoke-preview.log

      # Issue #251 Slice A: retain diagnostics on failure. The smoke log
      # above and deploy.log already exist as files; the usage block is
      # fetched from the org-scoped /api/usage/summary route (counts/IDs
      # only, no secrets) with the same ephemeral Bearer [REDACTED] Best-effort
      # (`|| true`): collection must never mask the real smoke failure, and
      # the upload below tolerates missing files.
      - name: Collect preview diagnostics
        if: failure() && steps.creds.outputs.present == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          LAB_TOKEN: ${{ steps.lab.outputs.token }}
        run: |
          if [[ -n "$PREVIEW_URL" && -n "$LAB_TOKEN" ]]; then
            curl -sS -m 30 -H "Authorization: Bearer $LAB_TOKEN" \
              "$PREVIEW_URL/api/usage/summary" -o usage-summary.json || true
          fi
          ls -la deploy.log smoke-preview.log usage-summary.json 2>/dev/null || true

      - name: Upload preview diagnostics
        if: failure() && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            deploy.log
            smoke-preview.log
            usage-summary.json

      - name: Comment preview URL
        if: steps.creds.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Preview deployed and smoked green: ${{ steps.deploy.outputs.url }}"

      - name: Comment preview failure
        if: failure() && steps.creds.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "Preview smoke failed — see the Preview workflow run."
